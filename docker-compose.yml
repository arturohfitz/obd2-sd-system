services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: obd2sd
      POSTGRES_USER: obd2sd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obd2sd -d obd2sd"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: OBD2 SD System
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY en .env}
      DATABASE_URL: postgresql+psycopg://obd2sd:${POSTGRES_PASSWORD}@db:5432/obd2sd
      CORS_ORIGINS: ${CORS_ORIGINS:-https://portal.obd2solucionesdiesel.com}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@obd2solucionesdiesel.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Configure INITIAL_ADMIN_PASSWORD en .env}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  uploads_data:
